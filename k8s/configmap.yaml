apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelgate-config
  namespace: sentinelgate
data:
  SG_SERVER__HOST: "0.0.0.0"
  SG_SERVER__PORT: "8080"
  SG_SERVER__MAX_CONCURRENT_STREAMS: "10000"
  SG_ML_ENGINE__ONNX_MODEL_PATH: "/etc/sentinelgate/models/deberta_injection.onnx"
  SG_ML_ENGINE__SLM_GGUF_PATH: "/etc/sentinelgate/models/llama_validator.gguf"
  SG_ML_ENGINE__PREFLIGHT_THRESHOLD: "0.85"
  SG_ML_ENGINE__THREAD_POOL_SIZE: "8"
  SG_CLICKHOUSE__URL: "http://clickhouse-service.sentinelgate.svc.cluster.local:8123"
  SG_CLICKHOUSE__TABLE: "audit_logs"
